<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderlast Adventures | Booking Section</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>BOOK YOUR TOUR</h1>
    </header>

    <main>
        <section id="booking-form">
            <h2>Booking Form</h2>
            <form action="">
                <label for="first-name">First Name</label>
                <input type="text">
                <label for="last-name">Last Name</label>
                <input type="text">
                <br>
                <label for="telephone-number">Telephone Number</label>
                <input type="number">
                <br>
                <label for="Adress">Address</label>
                <input type="text" placeholder="Street Address">
                <br>
                <input type="text" placeholder="Street Address 2">
                <br>
                <input type="text" placeholder="City">
                <input type="text" placeholder="Region">
                <br>
                <input type="text" placeholder="Postal / Zip Code">
                <!-- should have a drop down menu -->
                <input type="text" placeholder="Country">
                <br>
                <label for="email">Email</label>
                <input type="email">
                <br>
                <label for="total-no-of-adults">Total Number of Adults</label>
                <input type="number">
                <br>
                <label for="adult-names">Adult Names</label>
                <input type="text">
                <br>
                <label for="total-no-of-children">Total Number of Children</label>
                <input type="number">
                <br>
                <label for="children-names">Children Names and Ages</label>
                <input type="text">
                <br>
                <label for="type-of-travel">Type of Travel</label>
                <input type="text">
                <br>
                <label for="destination">Destination</label>
                <input type="text">
                <br>
                <label for="preferred-hotel/resort">Preferred Hotel / Resort</label>
                <input type="text">
                <br>
                <label for="number-of-rooms">Number of Rooms</label>
                <input type="number">
                <br>
                <label for="size-of-group">Size of Group</label>
                <input type="text">
                <br>
                <label for="king/double/suite/penthouse">King / Double / Suite / Penthouse</label>
                <input type="text">
                <br>
                <label for="transort">Transportation To and From the Hotel</label>
                <!-- there are supposed to be choices here i.e yes or no -->
                <br>
                <label for="estimated-trip">Estimated Trip</label>
                <input type="text">
                <br>
                <label for="above-age">Is anyone travelling over the age of 55</label>
                <!-- there are suposed to be choices here yes or no -->
                <br>
                <label for="special-instructions">Special Instructions</label>
                <input type="text">
                <br>
                <label for="activities">Activities: Spa, Golf, Excursion, Event Ticket, Shows etc</label>
                <input type="text">
                <br>
                <label for="travel-insurance">Include Travel Insurance</label>
                <!-- choices again -->
                <br>
                <button type="submit" class="button-1">BOOK NOW</button>
            </form>
        </section>
    </main>
    
</body>
</html>
