<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Tour</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>BOOK YOUR TOUR</h1>
        <form>
            <div class="double-input form-group">
                <input type="text" placeholder="First Name">
                <input type="text" placeholder="Last Name">
            </div>
            <div class="form-group">
                <input type="tel" placeholder="Telephone">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Address line 1">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Address line 2">
            </div>
            <div class="double-input form-group">
                <input type="text" placeholder="City">
                <input type="text" placeholder="Region">
            </div>
            <div class="double-input form-group">
                <input type="text" placeholder="Postal zip code">
                <input type="text" placeholder="Country">
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Total number of adults">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Adult Names">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Total Number of Children">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Children Names and Ages">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Type of Travel">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Destination">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Preferred Hotel / Resort">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Number Of Rooms">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Size Of Group">
            </div>
            <div class="form-group">
                <input type="text" placeholder="King / Double / Suite / Penthouse">
            </div>
            <div class="form-group">
                <label>Transportation To And From Hotel</label>
                <div class="radio-group">
                    <input type="radio" name="transport" id="transport-yes">
                    <label for="transport-yes">Yes</label>
                    <input type="radio" name="transport" id="transport-no">
                    <label for="transport-no">No</label>
                </div>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Estimated Trip">
            </div>
            <div class="form-group">
                <label>Is anyone travelling over the age of 55?</label>
                <div class="radio-group">
                    <input type="radio" name="age" id="age-yes">
                    <label for="age-yes">Yes</label>
                    <input type="radio" name="age" id="age-no">
                    <label for="age-no">No</label>
                </div>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Special Instructions">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Activities: Spa, Golf, Excursion, Event ticket, Shows, etc.">
            </div>
            <div class="form-group">
                <label>Include Travel Insurance</label>
                <div class="radio-group">
                    <input type="radio" name="insurance" id="insurance-yes">
                    <label for="insurance-yes">Yes</label>
                    <input type="radio" name="insurance" id="insurance-no">
                    <label for="insurance-no">No</label>
                </div>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Estimated total amount">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Method of payment">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Credit/ Debit card number/ Phone number">
            </div>
            <div class="form-group">
                <input type="password" placeholder="PIN number">
            </div>
            <div class="button-group">
                <button type="button">Confirm payment details</button>
                <button type="submit">BOOK NOW</button>
            </div>
        </form>
    </div>
</body>
</html>
